<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneSync</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e2df;
    --accent: #c2410c; --accent-text: #fff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #1e1e21; --text: #ececec; --muted: #9a9aa0; --line: #2e2e33;
            --accent: #f97316; --accent-text: #111; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; }
  header span { color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .devices { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .device { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
  .device h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--ok); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .table-wrap { overflow-x: auto; }
  progress { width: 200px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 8px 14px; border-radius: 8px; display: none; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header><h1>SceneSync</h1><span>Command center</span></header>
<main>
  <section id="pairing">
    <h2>Add a projector</h2>
    <p class="muted">Open the SceneSync player on the projector. It shows a 6-digit code. Enter it here.</p>
    <form class="row" id="pair-form">
      <input type="text" id="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required>
      <input type="text" id="pair-name" placeholder="Name (e.g. Front window)">
      <button class="primary" type="submit">Pair</button>
    </form>
    <div id="pending" class="muted" style="margin-top:8px"></div>
  </section>

  <section>
    <h2>Projectors</h2>
    <div id="devices" class="devices"><p class="muted">Loading…</p></div>
  </section>

  <section>
    <h2>Clips</h2>
    <p class="muted">Recommended export: H.264 MP4, 1280×720, 30 fps, AAC audio. Projectors have about 2 GB free, so keep clips short.</p>
    <div class="row">
      <input type="file" id="file" accept="video/*" multiple>
      <button class="primary" id="upload">Upload</button>
      <progress id="upload-progress" max="1" value="0" hidden></progress>
    </div>
    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead><tr><th>Clip ID</th><th>File</th><th>Size</th><th>Length</th><th>Video</th><th></th></tr></thead>
        <tbody id="media"></tbody>
      </table>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const state = { devices: [], media: [], pending: [] };
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 3500);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function bytes(n) {
  if (n == null) return "–";
  const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${u[i]}`;
}
function dur(ms) {
  if (ms == null) return "–";
  const s = Math.round(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function ago(t) {
  if (!t) return "never";
  const s = Math.round((Date.now() - new Date(t)) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  return new Date(t).toLocaleString();
}
function describe(d) {
  if (!d || d.state === "idle") return d && d.source ? "Black (manual stop)" : "Black (nothing scheduled)";
  const how = d.looping ? "Looping" : "Playing once";
  const why = d.source.startsWith("override:") ? "manual" : `rule ${d.source.slice(5)}`;
  return `${how} ${d.media_id} (${why})`;
}

function mediaWarnings(m) {
  const w = [];
  if (m.codec && m.codec !== "h264") w.push(`${m.codec} may not play smoothly; H.264 is safest`);
  if (m.width && m.height && (m.width > 1920 || m.height > 1080)) w.push("larger than 1080p");
  return w;
}

function renderPending() {
  $("pending").innerHTML = state.pending.length
    ? "Waiting to pair: " + state.pending.map((p) => `${esc(p.name)}${p.model ? " (" + esc(p.model) + ")" : ""}`).join(", ")
    : "";
}

function renderMedia() {
  $("media").innerHTML = state.media.map((m) => {
    const w = mediaWarnings(m);
    const video = m.width ? `${m.width}×${m.height} ${esc(m.codec || "")}` : '<span class="muted">unknown</span>';
    return `<tr>
      <td><code>${esc(m.id)}</code></td><td>${esc(m.filename)}</td><td>${bytes(m.size)}</td><td>${dur(m.duration_ms)}</td>
      <td>${video}${w.length ? `<div class="warn">${w.map(esc).join("; ")}</div>` : ""}</td>
      <td><button class="danger" data-del-media="${esc(m.id)}">Delete</button></td></tr>`;
  }).join("") || '<tr><td colspan="6" class="muted">No clips yet.</td></tr>';
}

function renderDevices() {
  const el = $("devices");
  if (!state.devices.length) { el.innerHTML = '<p class="muted">No projectors paired yet.</p>'; return; }
  const options = state.media.map((m) => `<option value="${esc(m.id)}">${esc(m.id)}</option>`).join("");
  el.innerHTML = state.devices.map((d) => {
    const r = d.report || {};
    const sizeById = Object.fromEntries(state.media.map((m) => [m.id, m.size]));
    const assigned = d.media.reduce((a, id) => a + (sizeById[id] || 0), 0);
    const space = r.storage_free_bytes != null && assigned > r.storage_free_bytes + (r.media_bytes || 0)
      ? `<span class="bad">clips need ${bytes(assigned)}, only ${bytes(r.storage_free_bytes)} free</span>` : r.storage_free_bytes == null ? "unknown" : bytes(r.storage_free_bytes) + " free";
    const sync = d.in_sync ? '<span class="ok">up to date</span>'
      : `<span class="warn">updating (has ${r.applied_revision ?? "none"}, needs ${d.revision})</span>`;
    const now = r.state === "playing" ? `${esc(r.media_id)}` : r.state === "error" ? '<span class="bad">error</span>' : "black";
    const errors = (r.errors || []).length ? `<dt>Errors</dt><dd class="bad">${r.errors.map(esc).join("<br>")}</dd>` : "";
    return `<div class="device" data-id="${esc(d.id)}">
      <h3><span class="dot ${d.online ? "on" : ""}" title="${d.online ? "connected" : "offline"}"></span>${esc(d.name)}</h3>
      <dl class="kv">
        <dt>Status</dt><dd>${d.online ? "connected" : "offline, last seen " + ago(d.last_seen)}</dd>
        <dt>Should show</dt><dd>${esc(describe(d.desired))}</dd>
        <dt>Showing</dt><dd>${now}</dd>
        <dt>Config</dt><dd>${sync}</dd>
        <dt>Storage</dt><dd>${space}</dd>
        <dt>Clips</dt><dd>${d.media.map(esc).join(", ") || "none"}</dd>
        <dt>Model</dt><dd>${esc(d.model || "–")} · app ${esc(d.app_version || "–")}</dd>
        ${errors}
      </dl>
      <div class="row">
        <select data-clip>${options}</select>
        <button data-cmd="once">Play once</button>
        <button data-cmd="loop" class="primary">Loop</button>
      </div>
      <div class="row">
        <button data-cmd="stop">Black</button>
        <button data-cmd="clear" ${d.override ? "" : "disabled"}>Return to schedule</button>
        <label class="muted"><input type="checkbox" data-hold> Hold until cleared</label>
      </div>
      <div class="row">
        <button data-rename>Rename</button>
        <button class="danger" data-remove>Remove</button>
      </div>
    </div>`;
  }).join("");
}

async function refresh() {
  try {
    const [devices, media, pending] = await Promise.all([
      api("GET", "/api/v1/admin/devices"), api("GET", "/api/v1/admin/media"), api("GET", "/api/v1/admin/pairings"),
    ]);
    // Keep the user's clip selection while re-rendering.
    const picked = {};
    document.querySelectorAll(".device").forEach((el) => (picked[el.dataset.id] = el.querySelector("[data-clip]")?.value));
    Object.assign(state, { devices, media, pending });
    renderPending(); renderMedia(); renderDevices();
    document.querySelectorAll(".device").forEach((el) => {
      const sel = el.querySelector("[data-clip]");
      if (sel && picked[el.dataset.id]) sel.value = picked[el.dataset.id];
    });
  } catch (e) { toast("Could not reach the server: " + e.message); }
}

$("pair-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("POST", "/api/v1/admin/pairings/approve", { code: $("pair-code").value, name: $("pair-name").value || null });
    $("pair-code").value = ""; $("pair-name").value = "";
    toast("Paired. The projector will connect in a few seconds.");
    refresh();
  } catch (err) { toast(err.message); }
});

$("devices").addEventListener("click", async (e) => {
  const card = e.target.closest(".device"); if (!card) return;
  const id = card.dataset.id;
  const hold = card.querySelector("[data-hold]").checked;
  const clip = card.querySelector("[data-clip]").value;
  try {
    const cmd = e.target.dataset.cmd;
    if (cmd) {
      let action = null;
      if (cmd === "once" || cmd === "loop") {
        if (!clip) return toast("Upload a clip first.");
        action = { type: "play", media_id: clip, loop: cmd === "loop" };
      } else if (cmd === "stop") action = { type: "stop" };
      await api("POST", `/api/v1/admin/devices/${encodeURIComponent(id)}/command`, { action, hold });
    } else if (e.target.dataset.rename !== undefined) {
      const name = prompt("New name"); if (!name) return;
      await api("PATCH", `/api/v1/admin/devices/${encodeURIComponent(id)}`, { name });
    } else if (e.target.dataset.remove !== undefined) {
      if (!confirm("Remove this projector? It will need to pair again.")) return;
      await api("DELETE", `/api/v1/admin/devices/${encodeURIComponent(id)}`);
    } else return;
    refresh();
  } catch (err) { toast(err.message); }
});

$("media").addEventListener("click", async (e) => {
  const id = e.target.dataset.delMedia; if (!id) return;
  if (!confirm(`Delete ${id}?`)) return;
  try { await api("DELETE", `/api/v1/admin/media/${encodeURIComponent(id)}`); refresh(); }
  catch (err) { toast(err.message); }
});

$("upload").addEventListener("click", () => {
  const files = $("file").files; if (!files.length) return toast("Choose a file first.");
  const form = new FormData(); for (const f of files) form.append("file", f, f.name);
  const xhr = new XMLHttpRequest(); const bar = $("upload-progress");
  bar.hidden = false; bar.value = 0; $("upload").disabled = true;
  xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) bar.value = ev.loaded / ev.total; };
  xhr.onloadend = () => {
    bar.hidden = true; $("upload").disabled = false;
    if (xhr.status >= 200 && xhr.status < 300) { $("file").value = ""; toast("Uploaded."); refresh(); }
    else { let m = xhr.statusText; try { m = JSON.parse(xhr.responseText).error; } catch {} toast("Upload failed: " + m); }
  };
  xhr.open("POST", "/api/v1/admin/media"); xhr.send(form);
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
